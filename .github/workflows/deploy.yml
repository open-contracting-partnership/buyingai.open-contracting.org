name: Deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install GT Eesti for the PDF page header
        run: |
          python3 -m venv /tmp/fonts
          /tmp/fonts/bin/pip install -q fonttools brotli
          /tmp/fonts/bin/python scripts/install-fonts.py
          fc-cache -f
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://buyingai.open-contracting.org
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm exec tsx scripts/build-content.ts
          pnpm exec next build --turbopack
          pnpm exec tsx scripts/build-pdfs.ts
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          cname: buyingai.open-contracting.org
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
